name: Verificar TVapp
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run export:android -w @tvapp/mobile
      - run: npm run export:android -w @tvapp/tv
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npx firebase-tools emulators:exec --project demo-tvapp --only firestore "npm run test:emulators"
